name: Market Hours OI Pulse

on:
  schedule:
    # Run every 5 minutes during trading days (Monday to Friday)
    - cron: "*/5 3-11 * * 1-5"
  workflow_dispatch:

jobs:
  ping-nifty-oi:
    name: Ping Nifty OI API & Record Timeline Tick
    runs-on: ubuntu-latest
    steps:
      - name: Hit Nifty OI Endpoint within Market Window
        run: |
          IST_TIME=$(TZ='Asia/Kolkata' date +%H%M)
          echo "Current IST Time: $IST_TIME"
          if [ "$IST_TIME" -ge "0915" ] && [ "$IST_TIME" -le "1540" ]; then
            echo "Within market window (09:15 - 15:40 IST). Pinging API..."
            curl -s -m 12 "https://options-scanner-seven.vercel.app/api/nifty-oi" > /dev/null || true
          else
            echo "Outside market window (09:15 - 15:40 IST). Skipping ping to protect EOD settlement integrity."
          fi
